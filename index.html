<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernanda & Gustavo | Bienvenidos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        olive: { 900: '#2F241E', 800: '#4A382F', 700: '#695548', 500: '#9A7E6A' },
                        cream: { 50: '#FDF9F4', 100: '#F7F1E7', 200: '#EDE1D1' },
                        gold: { 500: '#D4B167', 600: '#B88A3D' }
                    },
                    fontFamily: {
                        script: ['"Great Vibes"', 'cursive'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            margin: 0;
            overflow: hidden;
        }

        .font-script { font-family: 'Great Vibes', cursive; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }

        @keyframes timerProgress {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }
        .animate-timer {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: timerProgress 15s linear forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.8s ease-out both; }

        /* Floating background items */
        .intro-flower, .intro-bell, .intro-dove {
            position: absolute;
            display: block;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 10px 16px rgba(0,0,0,0.2));
            z-index: 5;
        }

        .intro-flower { font-size: 1.8rem; opacity: 0.85; animation: romanticFloat 7s ease-in-out infinite; }
        .intro-bell { font-size: 1.5rem; opacity: 0.8; animation: bellSwing 2.8s ease-in-out infinite; }
        .intro-dove { font-size: 2rem; opacity: 0.75; animation: doveFly 8s ease-in-out infinite; }

        .flower-1 { top: 10%; left: 8%; animation-delay: 0.3s; }
        .flower-2 { top: 15%; right: 10%; animation-delay: 1s; }
        .flower-3 { top: 65%; left: 10%; animation-delay: 2.8s; }
        .flower-4 { top: 70%; right: 12%; animation-delay: 3.2s; }

        .bell-1 { top: 22%; left: 24%; animation-delay: 0.5s; }
        .bell-2 { top: 18%; right: 26%; animation-delay: 1.2s; }

        .dove-1 { top: 28%; left: 45%; animation-delay: 0.6s; }
        .dove-2 { top: 58%; right: 38%; animation-delay: 2.4s; }

        @keyframes romanticFloat {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
            50% { transform: translate3d(-10px, 10px, 0) rotate(-12deg); }
        }
        @keyframes bellSwing {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(12deg); }
        }
        @keyframes doveFly {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-18px, 8px, 0) scale(0.95); }
        }
    </style>
</head>
<body class="relative h-screen w-screen flex items-center justify-center">

    <!-- FLOATING DECORATIONS -->
    <span class="intro-flower flower-1">🌸</span>
    <span class="intro-flower flower-2">🌺</span>
    <span class="intro-flower flower-3">🌹</span>
    <span class="intro-flower flower-4">🌸</span>
    <span class="intro-bell bell-1">🔔</span>
    <span class="intro-bell bell-2">🔔</span>
    <span class="intro-dove dove-1">🕊️</span>
    <span class="intro-dove dove-2">🕊️</span>

    <!-- BACKGROUND VIDEO -->
    <video id="introVideo" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-80">
        <source src="https://v1.pinimg.com/videos/iht/hls/b8/21/2e/b8212edd135485ea1f38071b22b27050.m3u8" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- OVERLAY GRADIENT -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/30 to-black/80 pointer-events-none"></div>

    <!-- SOUND TOGGLE -->
    <button id="toggleSoundBtn" onclick="toggleIntroSound()" class="absolute top-6 left-6 z-20 bg-black/40 hover:bg-black/70 backdrop-blur-md text-white text-xs px-3.5 py-2 rounded-full border border-white/20 flex items-center gap-2 transition cursor-pointer">
        <i id="soundIcon" class="fa-solid fa-volume-xmark text-gold-500"></i>
        <span id="soundText" class="uppercase tracking-wider text-[10px]">Turn on Audio</span>
    </button>

    <!-- SKIP BUTTON -->
    <button onclick="navigateToInvitation()" class="absolute top-6 right-6 z-20 bg-black/40 hover:bg-black/70 backdrop-blur-md text-white text-xs px-4 py-2 rounded-full border border-white/20 uppercase tracking-widest font-medium transition flex items-center gap-2 hover:scale-105 active:scale-95 cursor-pointer">
        Skip <i class="fa-solid fa-chevron-right text-[10px]"></i>
    </button>

    <!-- MAIN HEADING -->
    <div class="relative z-10 text-center px-6 text-cream-50 max-w-md animate-fade-in">
        <span class="text-xs uppercase tracking-[0.35em] text-gold-500 font-light block mb-3">Welcome to the celebration</span>
        
        <h1 class="font-script text-6xl sm:text-7xl text-cream-50 my-2 leading-tight drop-shadow-lg">
            Fernanda <br>
            <span class="text-3xl font-serif text-gold-500 my-1 block">&</span>
            Gustavo
        </h1>

        <p class="mt-4 text-xs tracking-[0.3em] uppercase text-cream-100 font-light">
            14 • 11 • 2025
        </p>
    </div>

    <!-- COUNTDOWN TIMER -->
    <div class="absolute bottom-10 z-10 flex flex-col items-center gap-2">
        <div class="relative w-12 h-12 flex items-center justify-center">
            <svg class="w-12 h-12 transform -rotate-90" viewBox="0 0 36 36">
                <path class="text-white/20" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                <path id="timerCirclePath" class="text-gold-500 animate-timer" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <span id="countdownSecs" class="absolute text-xs font-semibold text-cream-50">15</span>
        </div>
        <span class="text-[10px] uppercase tracking-widest text-cream-200/80">Entering the invitation...</span>
    </div>

    <script>
        let timeLeft = 15;
        const countdownEl = document.getElementById('countdownSecs');
        const video = document.getElementById('introVideo');

        // Countdown mechanism
        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (countdownEl) countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                navigateToInvitation();
            }
        }, 1000);

        function toggleIntroSound() {
            const soundIcon = document.getElementById('soundIcon');
            const soundText = document.getElementById('soundText');

            if (video.muted) {
                video.muted = false;
                soundIcon.className = 'fa-solid fa-volume-high text-gold-500';
                soundText.textContent = 'Mute Audio';
            } else {
                video.muted = true;
                soundIcon.className = 'fa-solid fa-volume-xmark text-gold-500';
                soundText.textContent = 'Turn on Audio';
            }
        }

        function navigateToInvitation() {
            window.location.href = 'invitation.html';
        }
    </script>
</body>
</html>
