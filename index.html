<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date | Our Love Story</title>
    <!-- Import Luxurious Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Remove default browser padding and margin */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c080a;
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* Style the video to cover the entire viewport */
        .fullscreen-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            filter: brightness(0.85) contrast(1.05);
            transition: opacity 1.2s ease;
        }

        /* Romantic, dreamy overlay with soft ambient lighting */
        .video-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            text-align: center;
            background: radial-gradient(circle at center, rgba(35, 20, 28, 0.45) 0%, rgba(10, 6, 9, 0.82) 100%);
            backdrop-filter: blur(1.5px);
        }

        /* Wrapper for romantic floating animation */
        .content-box {
            animation: floatUp 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(25px);
            max-width: 800px;
            width: 100%;
        }

        /* Script style heading */
        .our-love {
            display: block;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.4rem, 10vw, 8rem);
            font-weight: normal;
            font-style: normal;
            text-transform: none;
            letter-spacing: 0.04em;
            color: #ffd1dc;
            margin-bottom: -0.15em;
            text-shadow: 0 0 25px rgba(255, 192, 203, 0.6), 0 0 50px rgba(219, 112, 147, 0.3);
            animation: softPulse 4s ease-in-out infinite alternate;
        }

        /* Save the date text */
        .save-date {
            color: #fffaf7;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.6rem, 4.5vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 0.3em;
            line-height: 1.3;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 182, 193, 0.35);
        }

        /* Luxurious dividing line */
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 230, 0.8), transparent);
            margin: 1.8rem auto 0 auto;
            box-shadow: 0 0 10px rgba(255, 215, 230, 0.5);
        }

        /* Romantic poem */
        .poem {
            margin-top: 2rem;
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: clamp(0.9rem, 1.6vw, 1.15rem);
            line-height: 2;
            letter-spacing: 0.05em;
            color: rgba(255, 235, 240, 0.88);
            text-shadow: 0 0 18px rgba(255, 200, 210, 0.35);
        }

        .poem .line {
            display: block;
            opacity: 0;
            animation: fadeLine 1.4s ease forwards;
        }

        .poem .line:nth-child(1) { animation-delay: 1.2s; }
        .poem .line:nth-child(2) { animation-delay: 1.9s; }
        .poem .line:nth-child(3) { animation-delay: 2.6s; }

        /* Signature date */
        .date-sub {
            margin-top: 2rem;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(0.75rem, 1.4vw, 1rem);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255, 235, 240, 0.8);
            text-shadow: 0 0 18px rgba(255, 200, 210, 0.4);
            opacity: 0;
            animation: fadeLine 1.4s ease forwards;
            animation-delay: 3.3s;
        }

        /* Animations */
        @keyframes floatUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes softPulse {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 192, 203, 0.5); }
            100% { transform: scale(1.02); text-shadow: 0 0 35px rgba(255, 192, 203, 0.8), 0 0 10px rgba(255, 255, 255, 0.6); }
        }

        @keyframes fadeLine {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fallback background when video doesn't load */
        .video-fallback {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(219, 112, 147, 0.35), transparent 55%),
                radial-gradient(circle at 75% 70%, rgba(255, 182, 193, 0.25), transparent 50%),
                linear-gradient(135deg, #1a0f14 0%, #0c080a 100%);
            z-index: -1;
        }

        @media (max-width: 640px) {
            .save-date {
                letter-spacing: 0.2em;
            }
            .poem {
                line-height: 1.9;
            }
        }
    </style>
</head>
<body>

    <!-- Fallback background -->
    <div class="video-fallback"></div>

    <!-- Fullscreen Video Element -->
    <video class="fullscreen-video" autoplay muted playsinline loop id="heroVideo">
        <source src="vf.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="video-overlay">
        <div class="content-box">
            <span class="our-love">Our Love</span>
            <h1 class="save-date">Save the Date</h1>
            <div class="divider"></div>

            <!-- Short romantic poem -->
            <div class="poem">
                <span class="line">Two hearts,</span>
                <span class="line">one promise,</span>
                <span class="line">forever.</span>
            </div>

            <p class="date-sub">11 · 12 · 2026</p>
        </div>
    </div>

    <script>
        // Auto-redirect after 6 seconds (gives time to read the poem)
        setTimeout(function() {
            window.location.href = "secondpage.html";
        }, 6000);

        // Graceful video fallback: if video fails, keep the gradient background
        const video = document.getElementById('heroVideo');
        video.addEventListener('error', () => {
            video.style.opacity = '0';
        });

        // Ensure video plays on iOS / low-power mode
        document.addEventListener('touchstart', () => {
            video.play().catch(() => {});
        }, { once: true });
    </script>

</body>
</html>
